<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雾津日报 · 编辑部版面</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="report.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>

<div id="stage">

  <!-- 背景 -->
  <div class="bg"></div>
  <div class="bg-shade"></div>
  <div class="grain"></div>

  <!-- 顶部两角小字 -->
  <div class="corner corner-left">❖　星期三　8:00</div>
  <div class="corner corner-right">第 112 年 · 第 1 期</div>

  <!-- ============ 左：报头 + 五维 ============ -->
  <aside class="left-col">
    <div class="masthead">
      <div class="mh-rule"></div>
      <svg class="mh-orn" viewBox="0 0 240 20" aria-hidden="true">
        <path d="M8 11c30 0 42-5 66-4 16 .7 22 3 34 3"/>
        <path d="M232 11c-30 0-42-5-66-4-16 .7-22 3-34 3"/>
        <path d="M120 4.5l5 5.5-5 5.5-5-5.5z"/>
        <circle cx="8" cy="11" r="1.6"/><circle cx="232" cy="11" r="1.6"/>
      </svg>
      <h1 class="mh-name">雾津日报</h1>
      <div class="mh-en">WUJIN&nbsp;DAILY</div>
      <div class="mh-rule bottom"></div>
    </div>
    <div class="stats" id="stats"></div>
  </aside>

  <!-- ============ 中：主面板 ============ -->
  <section class="panel">
    <div class="sheet"></div>
    <div class="panel-inner" id="panelInner"></div>
  </section>

  <!-- ============ 右：现金 / 罗盘 / 立绘 ============ -->
  <aside class="right-col">
    <div class="money-row">
      <div class="cash" id="cashBox">
        <span class="coin">¥</span><span class="cash-num" id="cashNum">12,400</span>
      </div>
      <div class="compass">
        <div class="compass-label">立场</div>
        <svg viewBox="0 0 100 52" class="compass-svg">
          <rect x="3" y="3" width="94" height="46" fill="none" stroke="#a8433a" stroke-width="1.1" opacity=".85"/>
          <path d="M50 3V49M3 26H97" stroke="#a8433a" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
          <circle id="compassDot" cx="50" cy="26" r="3.4" fill="#7d1a17"/>
        </svg>
      </div>
    </div>

    <div class="portrait-card">
      <div class="portrait">
        <img src="assets/portrait.jpg" alt="报老板">
      </div>
      <div class="nameplate"><span>报老板</span><i></i><span>第三代继承人</span></div>
    </div>
  </aside>

  <!-- ============ 底部台词 ============ -->
  <div class="dialogue">
    <div class="avatar">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="15" r="6.4" fill="#4a3323"/>
        <path d="M7 36c1.6-7.4 6.6-11 13-11s11.4 3.6 13 11z" fill="#4a3323"/>
      </svg>
    </div>
    <div class="line" id="line"></div>
  </div>

  <!-- ============ 五步节点 ============ -->
  <nav class="steps" id="steps">
    <div class="step" data-step="0"><span class="num">1</span><span class="cap">选题</span></div>
    <div class="step" data-step="1"><span class="num">2</span><span class="cap">框架</span></div>
    <div class="step" data-step="2"><span class="num">3</span><span class="cap">记者</span></div>
    <div class="step" data-step="3"><span class="num">4</span><span class="cap">广告</span></div>
    <div class="step" data-step="4"><span class="num">5</span><span class="cap">付印</span></div>
  </nav>

  <!-- ============ 右下工具 ============ -->
  <div class="tools">
    <button class="tool" id="btnSave">
      <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v6h8V4"/><path d="M8 20v-6h8v6"/></svg>
      <span>存档</span>
    </button>
    <button class="tool" id="btnSetting">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      <span>设置</span>
    </button>
    <button class="tool" id="btnLog">
      <svg viewBox="0 0 24 24"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      <span>日志</span>
    </button>
  </div>

  <!-- 2 秒反馈条 -->
  <div class="toast" id="toast"></div>

  <!-- 日志浮层 -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="overlay-head">
        <span class="step-eyebrow">编辑部日志 · LOG</span>
        <button class="overlay-close" id="overlayClose">×</button>
      </div>
      <div class="overlay-body" id="logBody"></div>
    </div>
  </div>

</div>


<!-- ================= 终版 · 媒体画像（结算） ================= -->
<div id="reportLayer">
  <div id="rlStage">
    <div class="rl-bg"></div>
    <div class="rl-warm"></div>
    <div class="rl-vignette"></div>
    <div class="rl-bottom"></div>
    <div class="rl-grain"></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="rlRough" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>

    <div class="rl-topbar">
      <div class="l">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="#f3e2c0" stroke-width="1.4">
          <circle cx="12" cy="10" r="4.2"/>
          <path d="M12 3.2V1M12 19v-2M3.2 10H1M23 10h-2.2M5.6 3.6L4.2 2.2M19.8 17.8l-1.4-1.4M18.4 3.6l1.4-1.4M4.2 17.8l1.4-1.4"/>
          <path d="M6 17h9a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6" stroke-linecap="round"/>
        </svg>
        <span>民国十三年　三月十九日</span>
      </div>
      <div class="r" id="rlIssue">第 112 年 · 第 1 期 · 已付印</div>
    </div>
    <div class="rl-hairline"></div>

    <div class="rl-masthead">
      <div class="plate rl-chip"></div>
      <img src="assets/report-logo.png" alt="雾津日报">
    </div>

    <div class="rl-rail" id="rlRail"></div>

    <div class="rl-cash rl-chip">
      <span class="coin">¥</span>
      <span class="num"><b>账上</b><span id="rlCashNum">12,400</span></span>
    </div>

    <div class="rl-sealpad rl-chip">
      <div class="rl-seal" id="rlSeal">已<br>付印</div>
    </div>

    <div class="rl-boss">
      <img src="assets/portrait_cutout.png" alt="报老板">
      <div class="tag rl-chip">报老板 · <em>第三代继承人</em></div>
    </div>

    <div class="rl-paper">
      <div class="rl-face"></div>
      <div class="rl-inner">
        <div class="rl-kicker">终版 · 媒体画像</div>
        <h1>报老板的一天</h1>
        <div class="rl-rule"></div>

        <div class="rl-rank">
          <span class="lb">报格</span>
          <span class="nm" id="rlRankName">地方良心</span>
          <span class="sub" id="rlRankSub">四轴居中</span>
        </div>
        <div class="rl-desc" id="rlRankDesc"></div>

        <div class="rl-charts">
          <div class="rl-chart">
            <svg id="rlRadar" width="400" height="292" viewBox="0 0 400 292"></svg>
            <div class="rl-cap" id="rlCapRadar"></div>
          </div>
          <div class="rl-chart">
            <svg id="rlQuad" width="400" height="292" viewBox="0 0 400 292"></svg>
            <div class="rl-cap" id="rlCapQuad"></div>
          </div>
        </div>

        <div class="rl-foot">
          <span id="rlFootLeft">三天 · 十八次签字 · 停印 0 次</span>
          <span>这一局没有标准答案，只有代价</span>
        </div>
      </div>
    </div>

    <div class="rl-bubble rl-chip">
      <span class="mark">“</span>
      <span id="rlQuote"></span>
      <span class="attr">——《雾津市志 · 报业卷》，1937</span>
    </div>

    <div class="rl-replay" id="rlDays"></div>

    <div class="rl-tools">
      <button class="rl-tool" id="rlBtnCard">
        <span class="rl-chip"></span>
        <svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M7 7V4h10v3"/><path d="M9 13h6"/></svg>
        <span class="lb">名片</span>
      </button>
      <button class="rl-tool" id="rlBtnAgain">
        <span class="rl-chip"></span>
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.4 5.7"/><path d="M4 20v-5h5"/></svg>
        <span class="lb">再当一天</span>
      </button>
      <button class="rl-tool" id="rlBtnShare">
        <span class="rl-chip"></span>
        <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4"/><circle cx="17" cy="6" r="2.4"/><circle cx="17" cy="18" r="2.4"/><path d="M8.2 10.9l6.6-3.7M8.2 13.1l6.6 3.7"/></svg>
        <span class="lb">分享</span>
      </button>
    </div>
  </div>
</div>

<script src="../src/data.js"></script>
<script src="../src/engine.js"></script>
<script src="final-report.js"></script>
<script src="app.js"></script>
</body>
</html>
